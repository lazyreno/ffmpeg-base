name: Build Desktop FFmpeg SDK

on:
  workflow_dispatch:
    inputs:
      environment_probe:
        description: Inspect the Windows runner toolchain without building the SDK
        type: boolean
        default: false
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/build-desktop.yml"
      - "cmake-package/**"
      - "config/**"
      - "scripts/**"
      - "templates/**"
      - "tests/**"
      - "triplets/**"
      - "ports/**"
      - "vcpkg.json"
      - "vcpkg-configuration.json"
  push:
    branches:
      - main
    tags:
      - "v*"
    paths:
      - ".github/workflows/build-desktop.yml"
      - "cmake-package/**"
      - "config/**"
      - "scripts/**"
      - "templates/**"
      - "tests/**"
      - "triplets/**"
      - "ports/**"
      - "vcpkg.json"
      - "vcpkg-configuration.json"

permissions:
  contents: read

jobs:
  prepare-matrix:
    name: Prepare SDK Matrix
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      sdk_version: ${{ steps.matrix.outputs.sdk_version }}
      vcpkg_commit: ${{ steps.matrix.outputs.vcpkg_commit }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate production declarations
        run: |
          python3 -m json.tool config/sdk-version.json >/dev/null
          python3 -m json.tool config/ffmpeg-profile.json >/dev/null
          python3 -m json.tool config/platform-matrix.json >/dev/null
          python3 -m json.tool config/source-lock.json >/dev/null
          python3 -m json.tool config/vcpkg-lock.json >/dev/null
          python3 -m json.tool vcpkg.json >/dev/null
          python3 -m json.tool vcpkg-configuration.json >/dev/null
          python3 -m unittest discover -s tests/python -v
          for test_script in tests/cmake/*.cmake; do cmake -P "$test_script"; done

      - name: Generate build matrix
        id: matrix
        run: python3 scripts/generate-github-matrix.py --github-output "$GITHUB_OUTPUT"

  build-sdk:
    name: ${{ matrix.key }} SDK
    needs: prepare-matrix
    if: ${{ !inputs.environment_probe }}
    runs-on: ${{ matrix.runner }}
    env:
      VCPKG_DOWNLOADS: ${{ github.workspace }}/.vcpkg-root/downloads
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare-matrix.outputs.matrix) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Checkout pinned vcpkg
        uses: actions/checkout@v5
        with:
          repository: microsoft/vcpkg
          ref: ${{ needs.prepare-matrix.outputs.vcpkg_commit }}
          path: .vcpkg-root

      - name: Show macOS runner
        if: matrix.buildFamily == 'macos'
        run: |
          sw_vers
          uname -a
          clang --version
          cmake --version
          command -v vtool
          echo "ImageOS=${ImageOS:-unknown} ImageVersion=${ImageVersion:-unknown}"
          xcodebuild -version
          xcrun --show-sdk-version
          python3 --version
          df -h .
          git -C .vcpkg-root rev-parse HEAD

      - name: Setup MSYS2
        if: matrix.buildFamily == 'windows-msvc'
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MSYS
          path-type: inherit
          update: true
          cache: false
          release: false
          install: >-
            base-devel
            diffutils
            make
            nasm

      - name: Setup MSVC
        if: matrix.buildFamily == 'windows-msvc'
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio\Installer\vswhere.exe"
          $requiredComponent = if ("${{ matrix.arch }}" -eq "arm64") {
            "Microsoft.VisualStudio.Component.VC.Tools.ARM64"
          } else {
            "Microsoft.VisualStudio.Component.VC.Tools.x86.x64"
          }
          $vsInstall = & $vswhere -latest -products * -requires $requiredComponent -property installationPath
          if (-not $vsInstall) {
            throw "Visual Studio with MSVC tools was not found."
          }

          $vcvars = Join-Path $vsInstall "VC\Auxiliary\Build\vcvarsall.bat"
          if (!(Test-Path $vcvars)) {
            throw "vcvarsall.bat was not found: $vcvars"
          }

          $arch = "${{ matrix.msvcArch }}"
          $envLines = cmd /s /c "`"$vcvars`" $arch && set"
          $exportNames = @(
            "CommandPromptType",
            "DevEnvDir",
            "EXTERNAL_INCLUDE",
            "FrameworkDir",
            "FrameworkDir64",
            "FrameworkVersion",
            "FrameworkVersion64",
            "INCLUDE",
            "LIB",
            "LIBPATH",
            "NETFXSDKDir",
            "Path",
            "Platform",
            "UCRTVersion",
            "UniversalCRTSdkDir",
            "VCIDEInstallDir",
            "VCINSTALLDIR",
            "VCToolsInstallDir",
            "VCToolsRedistDir",
            "VCToolsVersion",
            "VisualStudioVersion",
            "VSINSTALLDIR",
            "WindowsLibPath",
            "WindowsSdkBinPath",
            "WindowsSdkDir",
            "WindowsSDKLibVersion",
            "WindowsSdkVerBinPath",
            "WindowsSDKVersion"
          )
          foreach ($line in $envLines) {
            $parts = $line -split "=", 2
            if ($parts.Count -eq 2 -and $exportNames -contains $parts[0]) {
              "$($parts[0])=$($parts[1])" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            }
          }

      - name: Expose MSYS2 NASM to the Windows build
        if: matrix.buildFamily == 'windows-msvc' && matrix.arch == 'x86_64'
        shell: pwsh
        run: |
          $msys2Location = '${{ steps.msys2.outputs.msys2-location }}'
          if ([string]::IsNullOrWhiteSpace($msys2Location)) {
            throw 'msys2/setup-msys2 did not report its installation directory.'
          }
          $msysNasm = Join-Path $msys2Location 'usr\bin\nasm.exe'
          if (!(Test-Path $msysNasm)) {
            throw "MSYS2 NASM was not installed: $msysNasm"
          }
          "FFMPEG_NASM=$msysNasm" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Bootstrap pinned vcpkg on macOS
        if: matrix.buildFamily == 'macos'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/bootstrap-pinned-vcpkg-macos.sh --vcpkg-root .vcpkg-root

      - name: Bootstrap pinned vcpkg on Windows
        if: matrix.buildFamily == 'windows-msvc'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/bootstrap-pinned-vcpkg-windows.py --vcpkg-root .vcpkg-root --lock-file config/vcpkg-lock.json --arch "${{ matrix.arch }}"

      - name: Cache pinned vcpkg build tools on macOS
        if: matrix.buildFamily == 'macos'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/prefetch-vcpkg-tools.py --vcpkg-root .vcpkg-root --os macos --arch "${{ matrix.arch }}"

      - name: Cache pinned vcpkg build tools on Windows
        if: matrix.buildFamily == 'windows-msvc'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/prefetch-vcpkg-tools.py --vcpkg-root .vcpkg-root --os windows --arch "${{ matrix.arch }}"

      - name: Install macOS x64 assembler tool
        if: matrix.buildFamily == 'macos' && matrix.arch == 'x86_64'
        run: |
          rm -rf /usr/local/Homebrew/Library/Taps/aws/homebrew-tap
          rm -rf /opt/homebrew/Library/Taps/aws/homebrew-tap
          brew install nasm

      - name: Install macOS Autotools for vcpkg source builds
        if: matrix.buildFamily == 'macos'
        run: |
          brew install autoconf autoconf-archive automake libtool
          mkdir -p "$RUNNER_TEMP/ffmpeg-build-tools"
          ln -s "$(brew --prefix libtool)/bin/glibtoolize" "$RUNNER_TEMP/ffmpeg-build-tools/libtoolize"
          echo "$RUNNER_TEMP/ffmpeg-build-tools" >> "$GITHUB_PATH"

      - name: Show Windows runner
        if: matrix.buildFamily == 'windows-msvc'
        shell: pwsh
        run: |
          systeminfo | Select-String "OS Name", "OS Version", "System Type"
          clang-cl --version | Select-Object -First 1
          link 2>&1 | Select-Object -First 1
          cmake --version
          bash --version
          python --version
          if ("${{ matrix.arch }}" -eq "x86_64") {
            & $env:FFMPEG_NASM -v
          }
          Write-Host "ImageOS=$env:ImageOS ImageVersion=$env:ImageVersion"
          Write-Host "VS=$env:VSINSTALLDIR MSVC=$env:VCToolsVersion WindowsSDK=$env:WindowsSDKVersion"
          Get-PSDrive -Name C
          git -C .vcpkg-root rev-parse HEAD

      - name: Resolve runner image for dependency cache
        id: runner-image
        shell: bash
        run: echo "version=${ImageVersion:-unknown}" >> "$GITHUB_OUTPUT"

      - name: Restore or save pinned vcpkg packages
        id: vcpkg-cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.vcpkg-binary-cache
          key: vcpkg-${{ matrix.key }}-${{ steps.runner-image.outputs.version }}-${{ needs.prepare-matrix.outputs.vcpkg_commit }}-${{ hashFiles('vcpkg.json', 'ports/**') }}

      - name: Install macOS v2 dependencies
        if: matrix.buildFamily == 'macos'
        env:
          MACOSX_DEPLOYMENT_TARGET: "11.0"
          VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/.vcpkg-binary-cache,readwrite
          X_VCPKG_ASSET_SOURCES: x-script,python3 ${{ github.workspace }}/scripts/fetch-vcpkg-github-asset.py {url} {sha512} {dst}
          GH_TOKEN: ${{ github.token }}
        run: |
          "${{ github.workspace }}/.vcpkg-root/vcpkg" install \
            --dry-run \
            --vcpkg-root "${{ github.workspace }}/.vcpkg-root" \
            --triplet "${{ matrix.triplet }}" \
            --overlay-ports "${{ github.workspace }}/ports" \
            --x-install-root "${{ github.workspace }}/.vcpkg-installed"
          "${{ github.workspace }}/.vcpkg-root/vcpkg" install \
            --vcpkg-root "${{ github.workspace }}/.vcpkg-root" \
            --triplet "${{ matrix.triplet }}" \
            --overlay-ports "${{ github.workspace }}/ports" \
            --x-install-root "${{ github.workspace }}/.vcpkg-installed" \
            --clean-after-build

      - name: Install Windows v2 dependencies
        if: matrix.buildFamily == 'windows-msvc'
        shell: pwsh
        env:
          VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/.vcpkg-binary-cache,readwrite
          GH_TOKEN: ${{ github.token }}
        run: |
          $python = (Get-Command python -ErrorAction Stop).Source
          $assetScript = Join-Path $env:GITHUB_WORKSPACE 'scripts\fetch-vcpkg-github-asset.py'
          $env:X_VCPKG_ASSET_SOURCES = "x-script,$python $assetScript {url} {sha512} {dst}"
          $vcpkgRoot = "${{ github.workspace }}\.vcpkg-root"
          & "$vcpkgRoot\vcpkg.exe" install `
            --dry-run `
            --vcpkg-root "$vcpkgRoot" `
            --triplet "${{ matrix.triplet }}" `
            --overlay-ports "${{ github.workspace }}\ports" `
            --x-install-root "${{ github.workspace }}/.vcpkg-installed"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$vcpkgRoot\vcpkg.exe" install `
            --vcpkg-root "$vcpkgRoot" `
            --triplet "${{ matrix.triplet }}" `
            --overlay-ports "${{ github.workspace }}\ports" `
            --x-install-root "${{ github.workspace }}/.vcpkg-installed" `
            --clean-after-build
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Build macOS SDK
        if: matrix.buildFamily == 'macos'
        env:
          SDK_ARCH: ${{ matrix.arch }}
          VCPKG_ROOT: ${{ github.workspace }}/.vcpkg-root
          VCPKG_INSTALLED_DIR: ${{ github.workspace }}/.vcpkg-installed
          MACOSX_DEPLOYMENT_TARGET: "11.0"
        run: scripts/build-macos.sh

      - name: Build Windows SDK
        if: matrix.buildFamily == 'windows-msvc'
        shell: pwsh
        env:
          SDK_ARCH: ${{ matrix.arch }}
          VCPKG_ROOT: ${{ github.workspace }}\.vcpkg-root
          VCPKG_INSTALLED_DIR: ${{ github.workspace }}/.vcpkg-installed
        run: scripts/build-windows-msvc.ps1

      - name: Resolve SDK artifact name
        id: sdk-artifact
        shell: bash
        env:
          SDK_PLATFORM: ${{ matrix.key }}
        run: |
          set -euo pipefail
          ffmpeg_version="$(python3 -c 'import json; print(json.load(open("config/sdk-version.json"))["ffmpegVersion"])')"
          sdk_version="$(python3 -c 'import json; print(json.load(open("config/sdk-version.json"))["sdkVersion"])')"
          echo "name=ffmpeg-sdk-${ffmpeg_version}-v${sdk_version}-${SDK_PLATFORM}" >> "$GITHUB_OUTPUT"

      - name: Pack SDK directory for transfer
        shell: bash
        env:
          SDK_ARTIFACT_NAME: ${{ steps.sdk-artifact.outputs.name }}
        run: |
          set -euo pipefail
          sdk_root="build/${{ matrix.key }}/sdk/${SDK_ARTIFACT_NAME}"
          [[ -f "${sdk_root}/manifest.json" ]] || {
            echo "Staged SDK manifest is missing: ${sdk_root}" >&2
            exit 1
          }
          tar -C "$(dirname "${sdk_root}")" -cf "${RUNNER_TEMP}/${SDK_ARTIFACT_NAME}.tar" "$(basename "${sdk_root}")"

      - name: Upload SDK transfer archive
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.sdk-artifact.outputs.name }}-stage
          path: ${{ runner.temp }}/${{ steps.sdk-artifact.outputs.name }}.tar
          archive: false
          if-no-files-found: error
          retention-days: 14

  probe-windows-environment:
    name: Probe ${{ matrix.arch }} Windows toolchain
    if: ${{ inputs.environment_probe }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, runner: windows-2022, msvcArch: x64 }
          - { arch: arm64, runner: windows-11-arm, msvcArch: arm64 }
    steps:
      - uses: actions/checkout@v5
      - uses: msys2/setup-msys2@v2
        id: msys2
        with:
          msystem: MSYS
          path-type: inherit
          update: false
          cache: false
          release: false
      - name: Setup MSVC for probe
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio\Installer\vswhere.exe"
          $requiredComponent = if ("${{ matrix.arch }}" -eq "arm64") {
            "Microsoft.VisualStudio.Component.VC.Tools.ARM64"
          } else {
            "Microsoft.VisualStudio.Component.VC.Tools.x86.x64"
          }
          $vsInstall = & $vswhere -latest -products * -requires $requiredComponent -property installationPath
          if (-not $vsInstall) { throw "Visual Studio with MSVC tools was not found." }
          $vcvars = Join-Path $vsInstall "VC\Auxiliary\Build\vcvarsall.bat"
          $envLines = cmd /s /c "`"$vcvars`" ${{ matrix.msvcArch }} && set"
          $exportNames = @(
            "CommandPromptType", "DevEnvDir", "EXTERNAL_INCLUDE", "FrameworkDir",
            "FrameworkDir64", "FrameworkVersion", "FrameworkVersion64", "INCLUDE",
            "LIB", "LIBPATH", "NETFXSDKDir", "Path", "Platform", "UCRTVersion",
            "UniversalCRTSdkDir", "VCIDEInstallDir", "VCINSTALLDIR", "VCToolsInstallDir",
            "VCToolsRedistDir", "VCToolsVersion", "VisualStudioVersion", "VSINSTALLDIR",
            "WindowsLibPath", "WindowsSdkBinPath", "WindowsSdkDir", "WindowsSDKLibVersion",
            "WindowsSdkVerBinPath", "WindowsSDKVersion"
          )
          foreach ($line in $envLines) {
            $parts = $line -split "=", 2
            if ($parts.Count -eq 2 -and $exportNames -contains $parts[0]) {
              "$($parts[0])=$($parts[1])" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            }
          }
      - name: Probe MSVC resource and response-file paths
        shell: pwsh
        run: scripts/probe-windows-runner.ps1

  publish-release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: [prepare-matrix, build-sdk]
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download SDK directories
        uses: actions/download-artifact@v8
        with:
          pattern: ffmpeg-sdk-*-stage
          path: staged-transfer

      - name: Archive SDKs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p staged-sdks release-assets
          for transfer_dir in staged-transfer/*; do
            [[ -d "${transfer_dir}" ]] || continue
            transfer_archive="$(find "${transfer_dir}" -maxdepth 1 -type f -name 'ffmpeg-sdk-*.tar' -print -quit)"
            [[ -n "${transfer_archive}" ]] || {
              echo "Downloaded SDK transfer archive is missing: ${transfer_dir}" >&2
              exit 1
            }
            tar -xf "${transfer_archive}" -C staged-sdks
          done
          for sdk_dir in staged-sdks/*; do
            [[ -d "${sdk_dir}" ]] || continue
            sdk_name="$(basename "${sdk_dir}")"
            [[ -f "${sdk_dir}/manifest.json" ]] || {
              echo "Downloaded SDK artifact is missing manifest.json: ${sdk_dir}" >&2
              exit 1
            }
            (cd staged-sdks && zip -qr "../release-assets/${sdk_name}.zip" "${sdk_name}")
            sha256sum "release-assets/${sdk_name}.zip" > "release-assets/${sdk_name}.zip.sha256"
          done

      - name: Validate release tag and generate artifact index
        shell: bash
        run: |
          set -euo pipefail
          sdk_version="${{ needs.prepare-matrix.outputs.sdk_version }}"
          release_tag="${GITHUB_REF_NAME}"
          [[ "${release_tag}" == "v${sdk_version}" ]] || {
            echo "release tag must match sdkVersion: expected v${sdk_version}, got ${release_tag}" >&2
            exit 1
          }
          python3 scripts/generate-artifact-index.py \
            --release-assets release-assets \
            --output release-assets/artifact-index.json \
            --base-url "https://github.com/${GITHUB_REPOSITORY}/releases/download/${release_tag}" \
            --release-tag "${release_tag}"
          python3 scripts/validate-release-assets.py --assets release-assets

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          sdk_version="${{ needs.prepare-matrix.outputs.sdk_version }}"
          release_tag="${GITHUB_REF_NAME}"
          gh release create "${release_tag}" release-assets/* \
            --target "${GITHUB_SHA}" \
            --title "FFmpeg SDK v${sdk_version}" \
            --notes "FFmpeg SDK v${sdk_version}."
