name: Publish Verified Desktop FFmpeg SDK

on:
  workflow_dispatch:
    inputs:
      candidate_run_id:
        description: Successful v2 candidate workflow run ID
        required: true
        type: string
      minimum_system_evidence:
        description: JSON record of native minimum-system tests for all four platforms
        required: true
        type: string

permissions:
  actions: read
  contents: write

concurrency:
  group: publish-ffmpeg-sdk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout release target
        uses: actions/checkout@v5

      - name: Validate source run, version, and minimum-system evidence
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          EVIDENCE_JSON: ${{ inputs.minimum_system_evidence }}
        run: |
          set -euo pipefail
          [[ "${CANDIDATE_RUN_ID}" =~ ^[0-9]+$ ]]
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${CANDIDATE_RUN_ID}" > candidate-run.json
          python3 - <<'PY'
          import json, os, pathlib, sys
          run = json.loads(pathlib.Path('candidate-run.json').read_text())
          expected = os.environ['GITHUB_SHA']
          if (run.get('conclusion') != 'success' or run.get('event') != 'workflow_dispatch'
                  or run.get('head_sha') != expected
                  or not run.get('path', '').endswith('/build-desktop.yml')):
              raise SystemExit('Candidate run must be a successful v2 build of the current main commit')
          matrix = json.loads(pathlib.Path('config/platform-matrix.json').read_text())['platforms']
          evidence = json.loads(os.environ['EVIDENCE_JSON'])
          if set(evidence) != {item['key'] for item in matrix if item['enabled']}:
              raise SystemExit('Evidence must cover exactly the four target platforms')
          for item in matrix:
              if not item['enabled']:
                  continue
              record = evidence[item['key']]
              if (record.get('systemVersion') != item['minimumSystemVersion']
                      or record.get('arch') != item['arch']
                      or record.get('result') != 'passed'
                      or not all(record.get(key) for key in ('ffmpegCommand', 'ffprobeCommand', 'decodeCommand', 'encodeCommand'))):
                  raise SystemExit(f"Missing native minimum-system evidence for {item['key']}")
          pathlib.Path('minimum-system-evidence.json').write_text(json.dumps(evidence, indent=2) + '\n')
          PY
          sdk_version="$(python3 -c 'import json; print(json.load(open("config/sdk-version.json"))["sdkVersion"])')"
          tag="v${sdk_version}"
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag}" >/dev/null 2>&1; then
            echo "Tag ${tag} is already occupied" >&2; exit 1
          fi
          if gh release view "${tag}" >/dev/null 2>&1; then
            echo "Release ${tag} already exists" >&2; exit 1
          fi
          echo "SDK_TAG=${tag}" >> "$GITHUB_ENV"

      - name: Download the verified candidate assets
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
        run: gh run download "${CANDIDATE_RUN_ID}" --repo "${GITHUB_REPOSITORY}" --name ffmpeg-sdk-v2-candidate --dir candidate-assets

      - name: Verify candidate archives and target commit
        run: |
          set -euo pipefail
          python3 scripts/generate-artifact-index.py \
            --release-assets candidate-assets \
            --output candidate-assets/artifact-index.json \
            --base-url "https://github.com/${GITHUB_REPOSITORY}/releases/download/${SDK_TAG}" \
            --release-tag "${SDK_TAG}"
          python3 scripts/validate-candidate-assets.py --assets candidate-assets
          cp minimum-system-evidence.json candidate-assets/minimum-system-evidence.json

      - name: Publish exactly the verified candidate ZIPs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ffmpeg_version="$(python3 -c 'import json; print(json.load(open("config/sdk-version.json"))["ffmpegVersion"])')"
          sdk_version="$(python3 -c 'import json; print(json.load(open("config/sdk-version.json"))["sdkVersion"])')"
          gh release create "${SDK_TAG}" candidate-assets/* \
            --target "${GITHUB_SHA}" \
            --title "FFmpeg SDK ${ffmpeg_version} v${sdk_version}" \
            --notes "Verified FFmpeg SDK v2 candidate from run ${{ inputs.candidate_run_id }}."
